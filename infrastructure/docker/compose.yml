services:
  api:
    container_name: cinex-api
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - ../../apps/api/.env
    environment:
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ../../apps/api:/workspace/apps/api
      - api_node_modules:/workspace/apps/api/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    container_name: cinex-web
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ../../apps/web:/workspace/apps/web
      - web_node_modules:/workspace/apps/web/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    profiles: [redis]
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  api_node_modules:
  web_node_modules:
